# Application Properties - GasTrack
spring.application.name=GasTrack

# Port du serveur (Render definit automatiquement PORT)
server.port=${PORT:8080}

# Configuration PostgreSQL (Render)
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://dpg-d5n18nq4d50c73dd4c5g-a.frankfurt-postgres.render.com/gastrack_lk4j}
spring.datasource.username=${DATABASE_USERNAME:gastrack_lk4j_user}
spring.datasource.password=${DATABASE_PASSWORD:IPRY5SUjPafbnhIK6OBaNjJHs8IS6Kkt}

# Configuration JPA/Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true

# Pool de connexions (optimise pour plan gratuit Render)
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.connection-timeout=20000

# Format des dates JSON
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss

# Actuator pour health check
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always
management.health.db.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.example.GasTrack=DEBUG
logging.level.org.hibernate.SQL=DEBUG

# Configuration prediction
prediction.min.data.points=3
prediction.confidence.threshold=0.5
prediction.history.days=30

# Swagger/OpenAPI
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true